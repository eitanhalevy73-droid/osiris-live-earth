<script>
window.onerror=function(msg,src,line,col,err){

 .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')

 .globeTileEngineUrl((x,y,l)=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+l+'/'+y+'/'+x)

 .onPointClick(d=>select(d,true))
 .onGlobeClick(({lat,lng})=>{pick={lat,lng};$('pk').textContent=lat.toFixed(1)+', '+lng.toFixed(1)})

let pick=null;

[...new Set(feats.map(c=>c.region))].sort().forEach(r=>{const o=document.createElement('option');o.value=o.textContent=r;$('reg').appendChild(o)});
['q','reg','showoff'].forEach(i=>$(i).addEventListener('input',render));

(function sky(){
 const cv=$('sky'),gx=cv.getContext('2d');let W,H,stars,bodies;
 function noise2(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
 function moonTex(seed){const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),rnd=noise2(seed);

/* ---------- tour / random / spin ---------- */
function liveList(){return feats.filter(c=>!dead[keyOf(c)]&&!c.iss)}
$('rand').onclick=()=>{const l=liveList();select(l[Math.random()*l.length|0],true)};
$('tour').onclick=()=>{if(tourT){clearInterval(tourT);tourT=null;$('tour').classList.remove('on');$('tour').textContent='▶ Auto tour';return}
 $('tour').classList.add('on');$('tour').textContent='⏸ Stop tour';const step=()=>{const l=liveList();select(l[Math.random()*l.length|0],true)};step();tourT=setInterval(step,22000)};
$('spin').classList.add('on');$('spin').onclick=()=>{spinning=!spinning;ctl.autoRotate=spinning;$('spin').classList.toggle('on',spinning)};
$('tog').onclick=()=>{$('side').classList.toggle('hide');$('tog').classList.toggle('shift')};
/* ---------- add cameras ---------- */
function parseYt(u){u=(u||'').trim();let m;if(m=u.match(/channel\/(UC[\w-]{22})/))return'channel:'+m[1];if(m=u.match(/(?:v=|youtu\.be\/|live\/|embed\/)([\w-]{11})/))return'video:'+m[1];if(/^UC[\w-]{22}$/.test(u))return'channel:'+u;if(/^[\w-]{11}$/.test(u))return'video:'+u;return null}
function addCam(name,lat,lng,yt){const c={name,lat,lng,yt,src:'YouTube Live',region:regionOf(lat,lng)};feats.push(c);MINE.push({name,lat,lng,yt,src:'YouTube Live'});lsSet('mycams',MINE);return c}
$('add').onclick=()=>{const yt=parseYt($('yt').value);if(!pick)return toast('Click the globe first to pick a spot');if(!yt)return toast('Could not read that YouTube link');addCam($('nm').value||'My camera',pick.lat,pick.lng,yt);render();toast('Camera added')};
$('imp').onclick=()=>{let ok=0,bad=0;$('bulk').value.split('\n').forEach(line=>{if(!line.trim())return;const p=line.split('|').map(s=>s.trim());if(p.length<3){bad++;return}const ll=p[1].split(/[ ,;]+/).map(Number),yt=parseYt(p[2]);if(ll.length<2||ll.some(isNaN)||!yt){bad++;return}addCam(p[0],ll[0],ll[1],yt);ok++});$('impm').textContent=ok+' added'+(bad?', '+bad+' skipped':'');render()};
/* ---------- open-data (non-YouTube) cameras — these are the blue dots ---------- */
const stat=(n,ok,m)=>{let d=document.getElementById('st-'+n.replace(/\W/g,''));if(!d){d=document.createElement('div');d.id='st-'+n.replace(/\W/g,'');d.style.cssText='font-size:11px;opacity:.85;line-height:1.5';let box=$('srcstat');if(!box){box=document.createElement('div');box.id='srcstat';box.style.cssText='font-size:11px;opacity:.85;margin:4px 0;line-height:1.5';$('list').parentNode.insertBefore(box,$('list'))}box.appendChild(d)}d.style.color=ok?'#7fe':'#f88';d.textContent=(ok?'● ':'○ ')+n+' — '+m};
const OK=v=>isFinite(parseFloat(v));
const cars511=(name,base)=>({n:name,f:async()=>{const j=await(await fetch(base+'/api/v2/get/cameras')).json();
  return j.map(c=>{const v=Array.isArray(c.Views)?c.Views:(c.Views&&Array.isArray(c.Views.Views)?c.Views.Views:[]);const first=v.find(x=>x&&(x.Url||x.url));
   return{name:c.Location||c.Roadway||c.RoadwayName||name+' camera',lat:+c.Latitude,lng:+c.Longitude,img:first&&(first.Url||first.url),src:name}}).filter(c=>OK(c.lat)&&OK(c.lng)&&c.img)}});
const OPEN=[
 {n:'NYC DOT',f:async()=>{const j=await(await fetch('https://webcams.nyctmc.org/api/cameras')).json();return j.filter(c=>c.isOnline!==false&&OK(c.latitude)).map(c=>({name:c.name,lat:+c.latitude,lng:+c.longitude,img:c.imageUrl||('https://webcams.nyctmc.org/api/cameras/'+c.id+'/image'),src:'NYC DOT'}))}},
 ...['01','02','03','04','05','06','07','08','09','10','11','12'].map(d=>({n:'Caltrans D'+d,f:async()=>{const j=await(await fetch('https://cwwp2.dot.ca.gov/data/d'+parseInt(d)+'/cctv/cctvStatusD'+d+'.json')).json();
  return j.data.map(x=>x.cctv).filter(c=>c&&c.inService!=='false'&&OK(c.location.latitude)).map(c=>({name:c.location.locationName,lat:+c.location.latitude,lng:+c.location.longitude,img:c.imageData.static.currentImageURL,hls:c.imageData.streamingVideoURL,src:'Caltrans'})).filter(c=>c.img||c.hls)}})),
 {n:'NSW Live Traffic',f:async()=>{const j=await(await fetch('https://data.livetraffic.com/cameras/traffic-cam.json')).json();
  return j.features.filter(x=>x.geometry&&x.geometry.coordinates).map(x=>{const p=x.properties||{};return{name:(p.title||p.view||'NSW camera')+(p.direction?' – '+p.direction:''),lat:x.geometry.coordinates[1],lng:x.geometry.coordinates[0],img:p.href||p.image||p.url,src:'NSW Live Traffic'}}).filter(c=>c.img)}},
 cars511('Ontario 511','https://511on.ca'),
 cars511('Alberta 511','https://511.alberta.ca')
];
let rT=null;const renderSoon=()=>{clearTimeout(rT);rT=setTimeout(render,400)};
OPEN.forEach(async s=>{try{const a=await s.f();a.forEach(c=>{c.region=regionOf(c.lat,c.lng);feats.push(c)});stat(s.n,true,a.length+' cameras');renderSoon()}catch(e){stat(s.n,false,'blocked or unavailable')}});
/* ---------- init ---------- */
$('tog').classList.remove('shift');render();sunUpdate();setInterval(()=>{if(simMin==null)sunUpdate()},30000);
openSatMap();
</script></body></html>
